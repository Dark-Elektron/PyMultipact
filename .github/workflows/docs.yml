name: docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install documentation dependencies
        # ngsolve/netgen are mocked by autodoc (see docs/source/conf.py) and
        # the example notebook ships with executed outputs
        # (nb_execution_mode = 'off'), so the docs build needs no FEM stack.
        run: >
          pip install numpy scipy pandas matplotlib ipywidgets
          sphinx myst-nb sphinx-immaterial numpydoc

      - name: Build documentation
        run: sphinx-build -b html docs/source docs/build/html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/build/html

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
